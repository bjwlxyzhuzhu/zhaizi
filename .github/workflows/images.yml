name: Build and publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: Test and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=ref,event=pr

      - name: Build image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: zhaizi:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test container
        run: |
          BOOTSTRAP_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$BOOTSTRAP_PASSWORD"
          echo "ZZ_BOOTSTRAP_PASSWORD=$BOOTSTRAP_PASSWORD" >> "$GITHUB_ENV"
          docker run --detach --name zhaizi-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env ZZ_JWT_SECRET="$(openssl rand -hex 32)" \
            --env ZZ_BOOTSTRAP_PASSWORD="$BOOTSTRAP_PASSWORD" \
            zhaizi:smoke

      - name: Verify API, frontend and authentication
        run: python3 scripts/smoke_test.py http://127.0.0.1:18000

      - name: Verify admin permissions, notifications and knowledge indexing
        run: |
          docker cp scripts/admin_features_test.py zhaizi-smoke:/tmp/admin_features_test.py
          docker exec --env PYTHONPATH=/srv/backend zhaizi-smoke python /tmp/admin_features_test.py

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build result
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '### Published Docker image'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            printf 'Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs on failure
        if: failure()
        run: docker logs zhaizi-smoke || true

      - name: Clean up test container
        if: always()
        run: docker rm --force --volumes zhaizi-smoke || true
