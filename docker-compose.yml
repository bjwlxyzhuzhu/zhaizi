# 部署：在本目录执行
#   cp .env.example .env   （修改 ZZ_JWT_SECRET 等）
#   docker compose up -d --build
# 访问 http://服务器IP:8080
#
# 默认使用 SQLite（数据在 zhaizi-data 卷中），单机演示与参赛评审足够。
# 需要 PostgreSQL 时：docker compose --profile pg up -d --build，并在 .env 里设置 DATABASE_URL。
services:
  zhaizi:
    build: .
    ports:
      - "${ZZ_PORT:-8080}:8000"
    env_file: .env
    volumes:
      - zhaizi-data:/data
    restart: unless-stopped

  postgres:
    profiles: ["pg"]
    image: postgres:16
    environment:
      POSTGRES_DB: zhaizi
      POSTGRES_USER: zhaizi
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  zhaizi-data:
  pgdata:
